services:
  dashboard:
    build: .
    container_name: flight-price-dashboard
    environment:
      TZ: "Europe/Vienna"
    command: uv run uvicorn app.app:app --reload --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"
    volumes:
      - ./flight_database.db:/app/flight_database.db:Z
    restart: always

  tracker:
    build: .
    container_name: flight-price-tracker
    environment:
      TZ: "Europe/Vienna"
    command: uv run main.py
    volumes:
      - ./flight_database.db:/app/flight_database.db:Z
      - ./searches.json:/app/searches.json:Z
      - ./google_credentials.json:/app/google_credentials.json:Z
      - ./logs:/app/logs:Z
    env_file:
      - .env
    init: true
    shm_size: 2gb