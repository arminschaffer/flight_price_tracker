<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Flight Price Tracker</title>
  <script src="https://cdn.plot.ly/plotly-latest.min.js"></script>
  <style>
    :root {
      --bg: #0b1220;
      --bg-elev: #111a2e;
      --bg-elev-2: #16213a;
      --border: rgba(255, 255, 255, 0.08);
      --border-strong: rgba(255, 255, 255, 0.14);
      --text: #e8eefc;
      --muted: #9aa7c0;
      --muted-2: #77829c;
      --accent: #7c9cff;
      --accent-2: #5eead4;
      --shadow: 0 20px 60px rgba(0, 0, 0, 0.35);
      --radius: 18px;
      --radius-sm: 12px;
    }

    * {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      padding: 0;
      min-height: 100%;
      background:
        radial-gradient(1200px 600px at 10% 0%, rgba(124, 156, 255, 0.16), transparent 55%),
        radial-gradient(900px 500px at 100% 10%, rgba(94, 234, 212, 0.10), transparent 45%),
        var(--bg);
      color: var(--text);
      font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility;
    }

    body {
      padding: 20px;
    }

    .shell {
      max-width: 1440px;
      margin: 0 auto;
    }

    .hero {
      display: flex;
      flex-direction: column;
      gap: 8px;
      margin: 0 0 18px 0;
      padding: 4px 2px 8px;
    }

    h1 {
      margin: 0;
      font-size: clamp(1.8rem, 3vw, 3rem);
      line-height: 1.1;
      font-weight: 800;
      letter-spacing: -0.04em;
    }

    .subtitle {
      margin: 0;
      color: var(--muted);
      font-size: 0.98rem;
      max-width: 70ch;
    }

    .card {
      background: linear-gradient(180deg, rgba(255,255,255,0.03), rgba(255,255,255,0.02));
      border: 1px solid var(--border);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
    }

    .card-pad {
      padding: 18px;
    }

    .section-gap {
      margin-bottom: 18px;
    }

    .row {
      display: flex;
      gap: 14px;
      flex-wrap: wrap;
      align-items: end;
    }

    .col {
      flex: 1;
      min-width: 240px;
    }

    label {
      display: block;
      width: 100%;
      color: var(--muted);
      font-size: 0.9rem;
      margin-bottom: 8px;
    }

    select {
      width: 100%;
      appearance: none;
      background: var(--bg-elev-2);
      color: var(--text);
      border: 1px solid var(--border-strong);
      border-radius: 14px;
      padding: 13px 14px;
      outline: none;
      font-size: 0.98rem;
      transition: border-color 0.2s ease, transform 0.15s ease, box-shadow 0.2s ease;
    }

    select:focus {
      border-color: rgba(124, 156, 255, 0.9);
      box-shadow: 0 0 0 4px rgba(124, 156, 255, 0.14);
    }

    select:hover {
      border-color: rgba(255,255,255,0.22);
    }

    .check-row {
      display: flex;
      gap: 18px;
      align-items: center;
      flex-wrap: wrap;
    }

    .check-pill {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      padding: 10px 14px;
      background: rgba(255,255,255,0.03);
      border: 1px solid var(--border);
      border-radius: 999px;
      color: var(--text);
      user-select: none;
    }

    .check-pill input {
      accent-color: var(--accent);
      transform: scale(1.05);
    }

    .graph-container {
      display: flex;
      gap: 18px;
      align-items: stretch;
      margin-bottom: 18px;
    }

    .chart {
      flex: 1;
      min-width: 0;
      min-height: 620px;
      overflow: hidden;
      position: relative;
    }

    .chart-inner {
      height: calc(100% - 10px);
      min-height: 560px;
      padding-bottom: 12px;
    }

    #line-chart{
      width: 100%;
      height: 96%;
    }

    #heatmap {
      width: 100%;
      height: 94%;
    }

    .plot-header {
      position: relative;
      z-index: 10;
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 14px;
      margin-bottom: 14px;
      pointer-events: none;
    }

    .plot-badge {
      pointer-events: auto;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 8px 12px;
      border-radius: 999px;
      background: rgba(17, 26, 46, 0.78);
      border: 1px solid var(--border);
      color: var(--text);
      font-size: 0.85rem;
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
    }

    .plot-controls {
      pointer-events: auto;
      display: inline-flex;
      flex-direction: row;
      align-items: center;
      gap: 10px;
      flex-wrap: nowrap;
      justify-content: flex-end;
    }

    .plot-controls .check-pill {
      padding: 8px 12px;
      background: rgba(17, 26, 46, 0.78);
    }

    .card h3 {
      margin: 0 0 14px 0;
      font-size: 1.05rem;
      letter-spacing: -0.02em;
    }

    .table-wrap {
      overflow-x: auto;
      border-radius: 14px;
      border: 1px solid var(--border);
      background: rgba(255,255,255,0.02);
    }

    table {
      width: 100%;
      border-collapse: collapse;
      min-width: 780px;
    }

    th, td {
      text-align: left;
      padding: 14px 14px;
      border-bottom: 1px solid rgba(255,255,255,0.06);
      vertical-align: top;
    }

    th {
      position: sticky;
      top: 0;
      background: rgba(17, 26, 46, 0.98);
      backdrop-filter: blur(10px);
      color: var(--text);
      font-weight: 700;
    }

    td {
      color: rgba(232, 238, 252, 0.92);
    }

    tbody tr:hover {
      background: rgba(124, 156, 255, 0.06);
    }

    .empty-state {
      padding: 18px;
      color: var(--muted);
    }

    /* Plotly theme adjustments */
    .js-plotly-plot .plotly .modebar {
      background: transparent !important;
    }

    /* Mobile layout */
    @media (max-width: 960px) {
      body {
        padding: 14px;
      }

      .graph-container {
        flex-direction: column;
      }

      .chart {
        min-height: 560px;
      }

      .chart-inner {
        min-height: 500px;
      }

      .plot-header {
        flex-direction: column;
        align-items: flex-start;
        margin-bottom: 12px;
      }

      .plot-controls {
        justify-content: flex-start;
        flex-wrap: wrap;
      }
    }

    @media (max-width: 640px) {
      .card-pad {
        padding: 14px;
      }

      .row {
        gap: 12px;
      }

      .col {
        min-width: 100%;
      }

      .chart {
        min-height: 500px;
      }

      .chart-inner {
        min-height: 440px;
      }

      select {
        padding: 12px 13px;
      }

      h1 {
        font-size: 1.7rem;
      }

      .subtitle {
        font-size: 0.92rem;
      }

      th, td {
        padding: 12px 10px;
      }
    }
  </style>
</head>
<body>
  <div class="shell">
    <header class="hero">
      <h1>Flight Price Tracker</h1>
      <p class="subtitle">Track and compare flight prices for your upcoming trips.</p>
    </header>

    <section class="card card-pad section-gap">
      <div class="row">
        <div class="col" style="padding-bottom: 5px;">
          <label for="route-drop"><b>Route</b></label>
          <select id="route-drop"></select>
        </div>
        <div class="col" style="flex: 0 0 auto; min-width: 260px;">
          <label>&nbsp;</label>
          <div class="check-row">
            <label class="check-pill"><input type="checkbox" id="archive-toggle"> Show archived flights</label>
          </div>
        </div>
      </div>
    </section>

    <section class="graph-container section-gap">
      <div id="line-chart-container" class="chart card card-pad">
        <div class="plot-header">
          <div class="plot-badge">Price trend</div>
          <div class="plot-controls">
            <label class="check-pill"><input type="checkbox" id="show-min" checked> Min</label>
            <label class="check-pill"><input type="checkbox" id="show-mean"> Mean</label>
            <label class="check-pill"><input type="checkbox" id="show-all"> All</label>
          </div>
        </div>
        <div id="line-chart" class="chart-inner"></div>
      </div>

      <div id="heat-map-container" class="chart card card-pad">
        <div class="plot-header">
          <div class="plot-badge">Price by date</div>
          <div style="flex: 1 1 auto; max-width: 260px; min-width: 220px; pointer-events: auto;">
            <label for="date-drop" style="margin-bottom: 6px;">Lookup date</label>
            <select id="date-drop"></select>
          </div>
        </div>
        <div id="heatmap" class="chart-inner"></div>
      </div>
    </section>

    <section class="card card-pad section-gap">
      <div class="row">
        <div class="col">
          <label for="dep-drop"><b>Departure Date</b></label>
          <select id="dep-drop"></select>
        </div>
        <div class="col">
          <label for="ret-drop"><b>Return Date</b></label>
          <select id="ret-drop"></select>
        </div>
      </div>
    </section>

    <section class="card card-pad">
      <h3>Available Offers</h3>
      <div id="table-area" class="table-wrap"></div>
    </section>
  </div>

  <script>
    const API = window.location.origin;

    async function fetchData(endpoint) {
      const res = await fetch(`${API}${endpoint}`);
      if (!res.ok) {
        throw new Error(`Request failed: ${res.status}`);
      }
      return await res.json();
    }

    function getThemeLayout() {
      return {
        paper_bgcolor: 'rgba(0,0,0,0)',
        plot_bgcolor: 'rgba(0,0,0,0)',
        font: { color: '#e8eefc' },
        xaxis: {
          gridcolor: 'rgba(255,255,255,0.08)',
          zerolinecolor: 'rgba(255,255,255,0.12)',
          linecolor: 'rgba(255,255,255,0.10)',
          tickfont: { color: '#9aa7c0' },
          titlefont: { color: '#e8eefc' }
        },
        yaxis: {
          gridcolor: 'rgba(255,255,255,0.08)',
          zerolinecolor: 'rgba(255,255,255,0.12)',
          linecolor: 'rgba(255,255,255,0.10)',
          tickfont: { color: '#9aa7c0' },
          titlefont: { color: '#e8eefc' }
        },
        legend: {
          orientation: 'h',
          yanchor: 'bottom',
          y: 1.02,
          xanchor: 'left',
          x: 0,
          font: { color: '#e8eefc' }
        }
      };
    }

    function setTableLoading(message = 'Loading offers…') {
      document.getElementById('table-area').innerHTML = `<div class="empty-state">${message}</div>`;
    }

    async function init() {
      const archived = document.getElementById('archive-toggle').checked;
      const routes = await fetchData(`/routes?archived=${archived}`);
      const rDrop = document.getElementById('route-drop');
      rDrop.innerHTML = routes.map(r => `<option value="${r.value}">${r.label}</option>`).join('');

      rDrop.onchange = updateRoute;
      document.getElementById('date-drop').onchange = updateSelection;
      document.getElementById('archive-toggle').onchange = init;
      document.getElementById('dep-drop').onchange = updateTable;
      document.getElementById('ret-drop').onchange = updateTable;

      ['show-min', 'show-mean', 'show-all'].forEach(id => {
        document.getElementById(id).onchange = renderLineChart;
      });

      if (!routes.length) {
        document.getElementById('line-chart').innerHTML = '<div class="empty-state">No routes available.</div>';
        document.getElementById('heatmap').innerHTML = '<div class="empty-state">No route selected.</div>';
        setTableLoading('No offers to show.');
        return;
      }

      updateRoute();
    }

    async function updateRoute() {
      const route = document.getElementById('route-drop').value;
      if (!route) return;

      const dates = await fetchData(`/dates?route=${encodeURIComponent(route)}`);
      const dDrop = document.getElementById('date-drop');
      dDrop.innerHTML = dates.map((d, i) => `<option value="${d}">${d}${i === 0 ? ' (latest)' : ''}</option>`).join('');

      await Promise.all([
        renderLineChart(),
        updateSelection()
      ]);
    }

    async function renderLineChart() {
      const route = document.getElementById('route-drop').value;
      if (!route) return;

      const showMin = document.getElementById('show-min').checked;
      const showMean = document.getElementById('show-mean').checked;
      const showAll = document.getElementById('show-all').checked;

      const data = await fetchData(`/line-chart?route=${encodeURIComponent(route)}`);

      const traces = [];
      const labels = ['>99%', '90-99%', '75-90%', '25-75%', '10-25%', '1-10%', '<1%'];
      const qKeys = ['1.0', '0.99', '0.9', '0.75', '0.25', '0.1', '0.01', '0.0'];
      const colors = [
        'rgba(239, 68, 68, 0.40)',   // 1. Red (Keep)
        'rgba(249, 115, 22, 0.40)',  // 2. Orange (Keep)
        'rgba(245, 158, 11, 0.40)',  // 3. Amber (Keep)
        'rgba(148, 163, 184, 0.32)', // 4. Neutral (Keep)
        'rgba(167, 243, 208, 0.50)', // 5. Pale Mint (Light & Airy)
        'rgba(52, 211, 153, 0.45)',  // 6. Emerald (Medium & Vibrant)
        'rgba(6, 78, 59, 0.55)'      // 7. Dark Pine (Deep & Heavy
        ];

      traces.push({
        x: data.x_q,
        y: data.quantiles[qKeys[0]],
        fill: 'none',
        line: { width: 0 },
        type: 'scatter',
        mode: 'lines',
        hoverinfo: 'skip',
        showlegend: false
      });

      for (let i = 0; i < qKeys.length - 1; i++) {
        traces.push({
          x: data.x_q,
          y: data.quantiles[qKeys[i + 1]],
          fill: 'tonexty',
          fillcolor: colors[i],
          line: { width: 0 },
          name: labels[i],
          type: 'scatter',
          mode: 'lines',
          hoverinfo: 'skip'
        });
      }

      if (showMin) {
        traces.push({
          x: data.x,
          y: data.min,
          name: 'Min',
          mode: 'lines+markers',
          line: { color: '#c7d2fe', width: 3 },
          marker: { size: 7 },
          type: 'scatter'
        });
      }

      if (showMean) {
        traces.push({
          x: data.x,
          y: data.mean,
          name: 'Mean',
          mode: 'lines+markers',
          line: { color: '#94a3b8', width: 2.5, dash: 'dot' },
          marker: { size: 6 },
          type: 'scatter'
        });
      }

      if (showAll) {
        for (let i = 0; i < data.min_con.length; i++) {
          traces.push({
            x: data.x,
            y: data.min_con[i],
            name: `Min ${i}`,
            mode: 'lines+markers',
            line: { color: 'rgba(229, 231, 235, 0.45)', width: 1.5 },
            marker: { size: 3 },
            type: 'scatter',
            opacity: 0.25,
            hoverinfo: 'skip',
            showlegend: false
          });
        }
      }

      const useCustomTicks = data.x_q.length < 8;
      const baseLayout = getThemeLayout();

      const layout = {
        ...baseLayout,
        margin: { t: 30, b: 95, l: 58, r: 18 },
        hovermode: 'x unified',
        hoverlabel: {
          bgcolor: '#111a2e',
          bordercolor: 'rgba(255,255,255,0.10)',
          font: {
            color: '#e8eefc'
          }
        },
        xaxis: {
          ...baseLayout.xaxis,
          tickformat: '%d %b',
          tickangle: -45,
          autorange: false,
          fixedrange: false,
          range: data.x_window,
          tickmode: useCustomTicks ? 'array' : 'auto',
          tickvals: useCustomTicks ? data.x_q : undefined
        },
        yaxis: {
          ...baseLayout.yaxis,
          tickprefix: '€',
          autorange: false,
          fixedrange: false,
          range: data.y_window
        }
      };

      Plotly.newPlot('line-chart', traces, layout, { responsive: true, displaylogo: false });
    }

    async function updateSelection() {
      const route = document.getElementById('route-drop').value;
      const date = document.getElementById('date-drop').value;
      if (!route || !date) return;

      const hm = await fetchData(`/heatmap?route=${encodeURIComponent(route)}&date=${date}`);
      if (!hm || !hm.z) {
        document.getElementById('heatmap').innerHTML = '<div class="empty-state">No heatmap data available.</div>';
        return;
      }

      const customData = hm.y.map((depDate, i) =>
        hm.x.map((retDate, j) => {
          const price = hm.original_z[i][j];
          const priceDisplay = (price !== null && price !== undefined) ? `€${Math.round(price)}` : 'N/A';
          return [
            priceDisplay, 
            hm.y[i], 
            hm.x[j], 
            hm.airline[i][j] ?? 'N/A', 
            hm.days_stayed[i][j] ?? 'N/A'
          ];
        })
      );

      const colorscale = [];
      hm.colors.forEach((c, i) => {
        colorscale.push([i / hm.colors.length, c]);
        colorscale.push([(i + 1) / hm.colors.length, c]);
      });

      const annotations = [];
      for (let i = 0; i < hm.y.length; i++) {
        for (let j = 0; j < hm.x.length; j++) {
          const price = hm.original_z[i][j];
          if (price !== null && price !== undefined) {
            annotations.push({
              x: hm.x[j],
              y: hm.y[i],
              text: `€${Math.round(price)}`,
              font: { color: '#e8eefc', size: 10 },
              showarrow: false
            });
          }
        }
      }

      const hmTrace = {
        z: hm.z,
        x: hm.x,
        y: hm.y,
        type: 'heatmap',
        colorscale: colorscale,
        showscale: false,
        customdata: customData,
        hovertemplate: hm.is_one_way
          ? 'Min Price: %{customdata[0]}' +
            '<br>Return: %{customdata[2]|%d %b %Y}' +
            '<br>Airline: %{customdata[3]}' +
            '<extra></extra>'
          : 'Min Price: %{customdata[0]}' +
            '<br>Departure: %{customdata[1]|%d %b %Y}' +
            '<br>Return: %{customdata[2]|%d %b %Y}' +
            '<br>Airline: %{customdata[3]}' +
            '<br>Stay: %{customdata[4]} days' +
            '<extra></extra>',
        zmin: 0,
        zmax: hm.colors.length,
        xgap: 2,
        ygap: 2
      };

      const baseLayout = getThemeLayout();
      const layout = {
        ...baseLayout,
        margin: { t: 24, b: 105, l: 80, r: 20 },
        hoverlabel: {
          bgcolor: '#111a2e',
          bordercolor: 'rgba(255,255,255,0.10)',
          font: {
            color: '#e8eefc'
          }
        },
        xaxis: {
          ...baseLayout.xaxis,
          tickangle: -45,
          tickformat: '%d %b',
          title: hm.is_one_way ? 'Departure Date' : 'Return Date',
          showgrid: false,
          tickmode: 'array',
          tickvals: hm.x
        },
        yaxis: {
          ...baseLayout.yaxis,
          tickformat: '%d %b',
          title: hm.is_one_way ? '' : 'Departure Date',
          showgrid: false,
          showticklabels: hm.is_one_way ? false : true,
          tickmode: 'array',
          tickvals: hm.is_one_way ? [] : hm.y
        },
        annotations: annotations
      };

      Plotly.newPlot('heatmap', [hmTrace], layout, { responsive: true, displaylogo: false });

      updateDropdowns(hm);
      updateTable();
    }

    function updateDropdowns(hm) {
      const depDrop = document.getElementById('dep-drop');
      if (hm.is_one_way) {
        depDrop.innerHTML = [...new Set(hm.x)].map(d => `<option value="${d}">${d}</option>`).join('');
      } else {
        depDrop.innerHTML = [...new Set(hm.y)].map(d => `<option value="${d}">${d}</option>`).join('');
      }

      const retDrop = document.getElementById('ret-drop');
      if (hm.is_one_way) {
        retDrop.innerHTML = '<option value="null">One Way</option>';
      } else {
        retDrop.innerHTML = [...new Set(hm.x)].map(d => `<option value="${d}">${d}</option>`).join('');
      }

      if (depDrop.options.length) depDrop.selectedIndex = 0;
      if (retDrop.options.length) retDrop.selectedIndex = 0;
    }

    async function updateTable() {
      const route = document.getElementById('route-drop').value;
      const sDate = document.getElementById('date-drop').value;
      const dDate = document.getElementById('dep-drop').value;
      const rDate = document.getElementById('ret-drop').value;

      if (!route || !sDate || !dDate) {
        setTableLoading('Select a route and dates to see offers.');
        return;
      }

      setTableLoading('Loading offers…');
      const flights = await fetchData(`/table?route=${encodeURIComponent(route)}&scrape_date=${sDate}&dep_date=${dDate}&ret_date=${rDate}`);

      if (!flights || !flights.length) {
        document.getElementById('table-area').innerHTML = '<div class="empty-state">No offers found for this selection.</div>';
        return;
      }

      let html = `<table><thead><tr><th>Airline</th><th>Time</th><th>Stops</th><th>Duration</th><th>Stay</th><th>Price</th></tr></thead><tbody>`;
      flights.forEach(f => {
        html += `<tr><td>${f.airline}</td><td>${f.flight_time}</td><td>${f.stops}</td><td>${f.duration}</td><td>${f.days_stayed} day(s)</td><td><b>€${f.price}</b></td></tr>`;
      });
      html += `</tbody></table>`;
      document.getElementById('table-area').innerHTML = html;
    }

    init().catch(err => {
      console.error(err);
      document.getElementById('line-chart').innerHTML = '<div class="empty-state">Something went wrong while loading the chart.</div>';
      document.getElementById('heatmap').innerHTML = '<div class="empty-state">Something went wrong while loading the heatmap.</div>';
      document.getElementById('table-area').innerHTML = '<div class="empty-state">Something went wrong while loading offers.</div>';
    });
  </script>
</body>
</html>
